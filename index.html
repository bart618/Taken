<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taken en notities</title>
<meta name="theme-color" content="#57305C">
<meta name="description" content="Taken en notities van De Logistieke Koplopers">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taken">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=Rethink+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
:root{
  --aub:#57305C;--aub2:#66396B;--pink:#CF9FC8;--tea:#C4D767;--jag:#273937;--ink:#202121;--off:#F6EFF5;
  --bg:#F6EFF5;--panel:#FFFFFF;--line:#E4D6E2;--text:#202121;--muted:#5E4A61;--chip:#EFE3ED;--chipText:#57305C;
  --done:#C4D767;--doneText:#273937;--warn:#F3E2B8;--warnText:#6A4A07;--new:#E8DAF0;--newText:#4A2A57;--later:#E8E8E6;--laterText:#4A4A48;
  --late:#F6D5D2;--lateText:#8A1C14;
  --n-none:#FFFFFF;--n-pink:#F7E6F4;--n-tea:#EEF4CF;--n-aub:#E8DAF0;--n-sand:#F7EEDB;
  --accent:var(--aub);
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1E1520;--panel:#2A1E2D;--line:#43324A;--text:#F6EFF5;--muted:#CF9FC8;--chip:#3A2940;--chipText:#E7CDE3;
  --done:#C4D767;--doneText:#1C2A28;--warn:#4A3A14;--warnText:#F3D98A;--new:#3E2A4A;--newText:#E7CDE3;--later:#333131;--laterText:#CFCFCC;
  --late:#4E1F1C;--lateText:#F5B8B2;
  --n-none:#2A1E2D;--n-pink:#3F2740;--n-tea:#2F3622;--n-aub:#3A2A48;--n-sand:#3A3022;--accent:var(--pink);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1520;--panel:#2A1E2D;--line:#43324A;--text:#F6EFF5;--muted:#CF9FC8;--chip:#3A2940;--chipText:#E7CDE3;
  --done:#C4D767;--doneText:#1C2A28;--warn:#4A3A14;--warnText:#F3D98A;--new:#3E2A4A;--newText:#E7CDE3;--later:#333131;--laterText:#CFCFCC;
  --late:#4E1F1C;--lateText:#F5B8B2;
  --n-none:#2A1E2D;--n-pink:#3F2740;--n-tea:#2F3622;--n-aub:#3A2A48;--n-sand:#3A3022;--accent:var(--pink);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Rethink Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5}
header{background:var(--aub);color:var(--off);padding:28px 20px 22px}
.wrap{max-width:1400px;margin:0 auto}
h1{font-family:Sora,"Rethink Sans",system-ui,sans-serif;font-weight:600;font-size:clamp(22px,3.4vw,32px);line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--pink);margin:0;max-width:62ch}
.meter{display:flex;align-items:center;gap:14px;margin-top:20px;flex-wrap:wrap}
.bar{flex:1;min-width:200px;height:10px;background:var(--aub2);border-radius:5px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--tea);width:0;transition:width .3s}
.count{font-family:Sora,sans-serif;font-size:22px;font-weight:600;color:var(--tea)}
.count small{font-size:14px;color:var(--pink);font-weight:400}
.sync{font:inherit;font-size:12.5px;color:var(--pink);background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.sync:hover{color:var(--off)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(20,10,22,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.modal[hidden]{display:none}
.mbox{background:var(--panel);color:var(--text);border-radius:14px;max-width:400px;width:100%;padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.mbox h2{font-family:Sora,"Rethink Sans",system-ui,sans-serif;font-weight:600;font-size:19px;margin:0 0 6px}
.mtxt{color:var(--muted);margin:0 0 14px;font-size:14px}
.mbox label{display:block;font-size:13px;font-weight:600;margin-bottom:12px}
.mbox input{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;font-size:16px}
.merr{color:var(--lateText);font-size:13px;min-height:1em;margin:0 0 10px}
.mrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.today{margin:4px 0 0;font-size:17px;color:var(--pink);max-width:52ch}
.today strong{font-family:Sora,sans-serif;font-weight:600;color:var(--tea);font-size:20px}
.today strong.late{color:#F5B8B2}
.logo{display:flex;align-items:center;gap:10px;flex:none;font-family:Sora,sans-serif;font-weight:600;font-size:14px;line-height:1.15;color:var(--off)}
.logo img{display:block;height:56px;width:56px;border-radius:12px}
.lmark{width:30px;height:30px;border-radius:7px;background:var(--tea);box-shadow:8px 8px 0 -2px var(--pink)}
@media (max-width:600px){.logo span{display:none}.logo img{height:44px;width:44px}}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 20px}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.frow+.frow{margin-top:8px}
.flabel{font-size:13px;color:var(--muted);margin-right:2px;min-width:74px}
.fb{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:4px 11px;cursor:pointer}
.fb[aria-pressed="true"]{background:var(--aub);border-color:var(--aub);color:var(--off)}
.fb.add{border-style:dashed;color:var(--muted)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--tea);outline-offset:2px}
input[type=search]{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);min-width:200px;flex:1;max-width:320px}

/* split 2/3 - 1/3 */
.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:32px;align-items:start}
main{padding:8px 20px 60px}
.col-notes{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px);max-height:calc(100vh - 140px);overflow:auto;padding:26px 4px 20px 0}
@media (max-width:900px){.split{grid-template-columns:1fr}.col-notes{position:static;max-height:none;overflow:visible;border-top:2px solid var(--accent);margin-top:26px}}

section.grp{margin-top:26px;border-radius:10px;transition:background .15s}
.gh{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:4px}
h2{font-family:Sora,sans-serif;font-weight:600;font-size:18px;margin:0}
.gc{font-size:13px;color:var(--muted);white-space:nowrap}
.gact{display:flex;align-items:center;gap:4px}
.gedit{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1}
.gin{font-family:Sora,sans-serif;font-size:16px;max-width:420px;flex:1;min-width:180px}
.gbtn{font:inherit;font-size:13px;border-radius:6px;padding:5px 10px;cursor:pointer}
body.isdrag section.grp{outline:1px dashed var(--line);outline-offset:6px}
section.grp.over{background:var(--chip);outline:2px dashed var(--aub)!important}

ul.tasks{list-style:none;margin:0;padding:0}
li.task{border-bottom:1px solid var(--line)}
.row{display:flex;align-items:flex-start;gap:8px;padding:9px 2px}
.cg{position:relative;width:26px;flex:none}
.grip{display:inline-block;color:var(--muted);font-size:16px;line-height:1;cursor:grab;padding:3px 4px;border-radius:4px}
.mv{position:absolute;inset:0;width:26px;height:26px;opacity:0;cursor:pointer;font:inherit;font-size:14px}
.cg:focus-within .grip{outline:2px solid var(--tea)}
li.task:hover .grip{color:var(--text)}
li.dragging{opacity:.4}
.cb{appearance:none;flex:none;width:22px;height:22px;border:2px solid var(--accent);border-radius:6px;margin:1px 0 0;cursor:pointer;display:grid;place-content:center;background:var(--panel)}
.cb:checked{background:var(--tea);border-color:var(--jag)}
.cb:checked::after{content:"";width:10px;height:6px;border-left:2.5px solid var(--jag);border-bottom:2.5px solid var(--jag);transform:rotate(-45deg) translate(1px,-1px)}
.main{flex:1;min-width:0}
.tbtn{font:inherit;font-weight:600;font-size:15px;color:var(--text);background:none;border:none;padding:0;text-align:left;cursor:pointer;display:flex;align-items:flex-start;gap:6px;max-width:100%}
.tbtn .chev{flex:none;color:var(--muted);transition:transform .15s;margin-top:3px}
.tbtn[aria-expanded="true"] .chev{transform:rotate(90deg)}
.tbtn span.tt{overflow-wrap:anywhere}
li.done .tt{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12.5px;align-items:center;margin-top:3px;padding-left:20px}
.snip{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46ch}
.st{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.st-late{background:var(--late);color:var(--lateText)}
.st-today{background:var(--done);color:var(--doneText)}
.st-soon{background:var(--warn);color:var(--warnText)}
.st-later{background:var(--later);color:var(--laterText)}
.chip{display:inline-block;background:var(--chip);color:var(--chipText);border-radius:5px;padding:1px 7px;font-size:12.5px}
.noteicon{position:relative;background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;padding:4px;border-radius:4px;line-height:0}
.noteicon.has{color:var(--accent)}
.noteicon.del:hover{color:#B3261E}
.dot{position:absolute;top:2px;right:0;width:7px;height:7px;border-radius:50%;background:var(--tea);border:1px solid var(--jag)}
.acts{display:flex;gap:2px;flex:none}
.star{color:var(--accent);font-size:11px;margin-left:5px;vertical-align:2px;text-decoration:none;display:inline-block}
.due{flex:none;margin-top:2px;margin-right:-4px}
.duebtn{position:relative;cursor:pointer}
.duebtn:hover{filter:brightness(.94)}
.duebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.duepick{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;margin:0;font-size:16px;color-scheme:light dark}
.duepick::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;cursor:pointer}
.detail{padding:0 2px 14px 70px;display:grid;gap:8px}
.drow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.drow input[type=date]{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text)}
textarea{display:block;width:100%;max-width:72ch;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);min-height:80px;resize:vertical}
.linkbtn{font:inherit;font-size:12.5px;background:none;border:none;color:var(--muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:0}
.ein{display:block;width:100%;font:inherit;font-size:14px;font-weight:600;padding:5px 8px;border:1px solid var(--aub);border-radius:6px;background:var(--panel);color:var(--text)}
.sv{background:var(--aub);color:var(--off);border:1px solid var(--aub)}
.cx{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.noteicon.plus{color:var(--accent)}
.donegrp{margin-top:40px;opacity:.95}
.dtoggle{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;display:flex;align-items:center;gap:8px}
.dtoggle .chev{color:var(--muted);transition:transform .15s}
.dtoggle[aria-expanded="true"] .chev{transform:rotate(90deg)}
.addrow{display:flex;gap:8px;padding:10px 2px 4px 36px;align-items:center;flex-wrap:wrap}
.addrow input{font:inherit;font-size:14px;flex:1;padding:6px 10px;border:1px dashed var(--line);border-radius:8px;background:transparent;color:var(--text)}
.addrow input:focus{border-style:solid;background:var(--panel)}
.addrow input[type=date]{flex:none;width:auto;color:var(--muted)}
.empty{padding:30px 0;color:var(--muted)}
.emptyg{color:var(--muted);font-size:13px;font-style:italic;padding:12px 2px 2px 36px}

/* notes */
.nh{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:2px solid var(--accent);padding-bottom:6px;margin-bottom:12px}
.ngrid{display:grid;gap:10px}
.note{border:1px solid var(--line);border-radius:10px;background:var(--n-none);overflow:hidden}
.note[data-c="pink"]{background:var(--n-pink)}.note[data-c="tea"]{background:var(--n-tea)}.note[data-c="aub"]{background:var(--n-aub)}.note[data-c="sand"]{background:var(--n-sand)}
.note.open{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.nbtn{font:inherit;width:100%;text-align:left;background:none;border:none;color:var(--text);cursor:pointer;padding:12px 14px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.nbtn .nt{font-weight:600;overflow-wrap:anywhere}
.nbtn .nt.untitled{color:var(--muted);font-weight:500}
.nbtn .nm{display:flex;gap:6px;align-items:center;flex:none;font-size:12px;color:var(--muted)}
.nbody{padding:0 14px 12px;display:grid;gap:8px}
.nbody .ntitle{font-family:Sora,sans-serif;font-weight:600;font-size:15px;border:none;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:4px 0;color:var(--text);width:100%}
.nbody textarea{background:transparent;border:1px solid transparent;padding:4px 0;min-height:140px;max-width:none}
.nbody textarea:focus{border-color:var(--line);padding:4px 6px;background:var(--panel)}
.nfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.nfoot select{font:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);padding:3px 6px}
.sw{display:flex;gap:5px}
.sw button{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.sw [data-col="none"]{background:var(--n-none)}.sw [data-col="pink"]{background:var(--n-pink)}.sw [data-col="tea"]{background:var(--n-tea)}.sw [data-col="aub"]{background:var(--n-aub)}.sw [data-col="sand"]{background:var(--n-sand)}
.nempty{color:var(--muted);font-size:14px;padding:6px 0}

.foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px}
.act{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 14px;cursor:pointer}
.act.pri{background:var(--aub);border-color:var(--aub);color:var(--off)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.toastbar{position:sticky;bottom:0;display:flex;justify-content:center;pointer-events:none;padding:0 20px calc(14px + env(safe-area-inset-bottom,0px))}
.toast:not(:empty){pointer-events:auto;background:var(--ink);color:var(--off);padding:8px 14px;border-radius:8px;font-size:14px}
.undo{font:inherit;font-size:13px;background:none;border:none;color:var(--tea);cursor:pointer;text-decoration:underline;margin-left:6px}
@media (max-width:600px){
  /* invoervelden op 16px: voorkomt dat iOS inzoomt en het scherm niet meer past */
  input,textarea,select,.addrow input,.drow input[type=date],.ein,input[type=search],textarea{font-size:16px}
  /* filterbalk scrolt mee in plaats van vast te staan, en is compacter */
  .filters{position:static;padding:10px 16px}
  .flabel{display:none}
  input[type=search]{max-width:none;min-width:0;width:100%}
  #f-rub,#f-plan{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px 2px}
  #f-rub::-webkit-scrollbar,#f-plan::-webkit-scrollbar{display:none}
  #f-rub .fb,#f-plan .fb{flex:none;white-space:nowrap;padding:6px 12px}
  main{padding-left:16px;padding-right:16px}
  /* taakregel: titel over de volle breedte, datum en knoppen eronder */
  .row{display:grid;grid-template-columns:26px 22px auto auto 1fr auto;column-gap:8px;row-gap:2px;align-items:center}
  .row>.cg{grid-column:1;grid-row:1;align-self:start}
  .row>.cb{grid-column:2;grid-row:1;align-self:start}
  .row>.main{grid-column:3/-1;grid-row:1}
  .row>.chip{grid-column:3;grid-row:2}
  .row>.due{grid-column:4;grid-row:2;margin:0}
  .row>.acts{grid-column:6;grid-row:2}
  .noteicon{padding:8px}
  .detail{padding-left:34px}
  .drow input[type=date]{min-height:42px;min-width:160px}
  textarea{max-width:none}
  /* nieuwe taak: tekst bovenaan, datum en knoppen eronder */
  .addrow{padding:10px 0 4px}
  .addrow input[type=text]{flex:1 1 100%;padding:10px 12px}
  .addrow input[type=date]{display:block;flex:1 1 0;min-width:0;min-height:42px;padding:8px 10px;border-style:solid;background:var(--panel);color:var(--text)}
  .addrow .gbtn{padding:10px 14px}
}
@media (prefers-reduced-motion:reduce){.bar span,.tbtn .chev{transition:none}}
</style>
</head>
<body>
<header>

const KEY="koplopers-taken-notities-v1";
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const blank=()=>({v:1,ts:0,groups:[{id:"inbox",t:"Inbox"}],tasks:[],notes:[]});
let state=blank();
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.groups)state=s}catch(e){}

function save(){
  state.ts=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){setSync("Opslaan lukte niet in deze browser")}
  if(typeof schedulePush==="function")schedulePush();
}
const setSync=t=>document.getElementById("sync").textContent=t;
/* vraag de browser om de gegevens niet automatisch op te ruimen */
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{})}

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const GA=()=>state.groups.filter(g=>!g.del);
const gname=id=>{const g=state.groups.find(x=>x.id===id);return g?g.t:""};
const liveT=()=>state.tasks.filter(t=>!t.del&&GA().some(g=>g.id===t.g));
const openT=new Set(),openN=new Set();let editing=null,editingGroup=null,adding=null;

/* dates */
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const pd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const MON=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
function dueInfo(s){
  if(!s)return null;const d=pd(s),diff=Math.round((d-today())/864e5);
  const lab=`${d.getDate()} ${MON[d.getMonth()]}${d.getFullYear()!==today().getFullYear()?" "+d.getFullYear():""}`;
  if(diff<0)return{k:"late",t:`${lab}, verlopen`,diff};
  if(diff===0)return{k:"today",t:"Vandaag",diff};
  if(diff===1)return{k:"soon",t:"Morgen",diff};
  if(diff<=7)return{k:"soon",t:lab,diff};
  return{k:"later",t:lab,diff};
}

/* filters */
const F={rub:new Set(),plan:null,q:"",hideDone:false};
const PLAN={late:"Verlopen",today:"Vandaag",week:"Komende 7 dagen",none:"Zonder datum"};
function buildFilters(){
  const fr=document.getElementById("f-rub");fr.innerHTML=`<span class="flabel">Rubriek</span>`;
  [...F.rub].forEach(id=>{if(!GA().some(g=>g.id===id))F.rub.delete(id)});
  GA().forEach(g=>{const b=document.createElement("button");b.className="fb";b.textContent=g.t;b.setAttribute("aria-pressed",F.rub.has(g.id));
    b.onclick=()=>{F.rub.has(g.id)?F.rub.delete(g.id):F.rub.add(g.id);b.setAttribute("aria-pressed",F.rub.has(g.id));render();renderNotes()};fr.appendChild(b)});
  const a=document.createElement("button");a.className="fb add";a.textContent="Rubriek toevoegen";a.onclick=addGroup;fr.appendChild(a);
  const fp=document.getElementById("f-plan");fp.innerHTML=`<span class="flabel">Planning</span>`;
  Object.keys(PLAN).forEach(k=>{const b=document.createElement("button");b.className="fb";b.textContent=PLAN[k];b.setAttribute("aria-pressed",F.plan===k);
    b.onclick=()=>{F.plan=F.plan===k?null:k;buildFilters();render()};fp.appendChild(b)});
  const h=document.createElement("button");h.className="fb";h.textContent="Verberg afgevinkt";h.setAttribute("aria-pressed",F.hideDone);
  h.onclick=()=>{F.hideDone=!F.hideDone;h.setAttribute("aria-pressed",F.hideDone);render()};fp.appendChild(h);
}
document.getElementById("q").addEventListener("input",e=>{F.q=e.target.value.toLowerCase();render();renderNotes()});
function match(t){
  if(F.hideDone&&t.done)return false;
  if(F.plan){const i=dueInfo(t.due);
    if(F.plan==="none"&&i)return false;
    if(F.plan==="late"&&!(i&&i.diff<0))return false;
    if(F.plan==="today"&&!(i&&i.diff===0))return false;
    if(F.plan==="week"&&!(i&&i.diff>=0&&i.diff<=7))return false;}
  if(F.q&&!(t.t+" "+(t.note||"")).toLowerCase().includes(F.q))return false;
  return true;
}

const IC={
  edit:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4M13.5 6.5l4 4"/></svg>`,
  note:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>`,
  del:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>`,
  chev:`<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>`,
  plus:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>`,
  cal:`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg>`
};

function taskLi(t,gid,chip){
      const di=dueInfo(t.due),open=openT.has(t.id);
      if(editing===t.id){
        return `<li class="task" data-id="${t.id}"><div class="row"><span class="cg"></span><span style="width:22px"></span><div class="main"><input class="ein" data-et="${t.id}" value="${esc(t.t)}" aria-label="Taak"></div><div class="acts"><button class="sv gbtn" data-save="${t.id}">Opslaan</button><button class="cx gbtn" data-cancel="${t.id}">Annuleren</button></div></div></li>`;
      }
      return `<li class="task${t.done?" done":""}" data-id="${t.id}" draggable="true"><div class="row">
        <span class="cg"><span class="grip" title="Sleep naar een andere rubriek, of klik om te kiezen" aria-hidden="true">⠿</span><select class="mv" data-mv="${t.id}" aria-label="${esc(t.t)} verplaatsen naar rubriek"><option value="">Verplaats naar…</option>${GA().filter(x=>x.id!==gid).map(x=>`<option value="${x.id}">${esc(x.t)}</option>`).join("")}</select></span>
        <input type="checkbox" class="cb" id="cb-${t.id}" ${t.done?"checked":""} aria-label="${esc(t.t)} klaar">
        <div class="main"><button class="tbtn" data-open="${t.id}" aria-expanded="${open}">${IC.chev}<span class="tt">${esc(t.t)}${t.note&&t.note.trim()?`<span class="star" title="Heeft een notitie" aria-hidden="true">★</span><span class="sr"> (heeft een notitie)</span>`:""}</span></button>
          </div>
        ${chip?`<span class="chip">${esc(gname(gid))}</span>`:""}
        ${di?`<label class="st st-${di.k} due duebtn" title="Datum wijzigen">${di.t}<input type="date" class="duepick" data-due="${t.id}" value="${t.due}" aria-label="Datum van ${esc(t.t)} wijzigen"></label>`:""}
        <div class="acts"><button class="noteicon" data-edit="${t.id}" aria-label="${esc(t.t)} bewerken" title="Bewerken">${IC.edit}</button>
        <button class="noteicon${t.note?" has":""}" data-open="${t.id}" aria-expanded="${open}" aria-label="Notitie en datum bij ${esc(t.t)} ${open?"inklappen":"uitklappen"}" title="${t.note?"Notitie":"Notitie of datum toevoegen"}">${IC.note}${t.note?'<span class="dot"></span>':""}</button>
        <button class="noteicon del" data-del="${t.id}" aria-label="${esc(t.t)} verwijderen" title="Verwijderen">${IC.del}</button></div></div>
        ${open?`<div class="detail"><div class="drow">${IC.cal}<label for="dd-${t.id}">Datum</label><input type="date" id="dd-${t.id}" data-due="${t.id}" value="${t.due||""}">${t.due?`<button class="linkbtn" data-nodue="${t.id}">Datum wissen</button>`:""}</div>
        <textarea data-ta="${t.id}" aria-label="Notitie bij ${esc(t.t)}" placeholder="Notitie bij deze taak">${esc(t.note||"")}</textarea></div>`:""}</li>`;
}
let doneOpen=false;
function render(){
  const list=document.getElementById("list");let html="",shown=0;
  const filtering=F.rub.size||F.plan||F.q||F.hideDone;
  const groups=GA().filter(g=>!F.rub.size||F.rub.has(g.id));
  groups.forEach(g=>{
    const all=state.tasks.filter(t=>t.g===g.id&&!t.del),vis=all.filter(t=>!t.done&&match(t)).sort((a,b)=>{const x=a.due||"9999-99-99",y=b.due||"9999-99-99";return x<y?-1:x>y?1:0});
    if(!vis.length&&filtering&&(F.plan||F.q||F.hideDone))return;shown+=vis.length+1;
    const dn=all.filter(t=>t.done).length;
    html+=`<section class="grp" data-group="${g.id}"><div class="gh">${editingGroup===g.id?`<div class="gedit"><input class="ein gin" data-gin="${g.id}" value="${esc(g.t)}" aria-label="Naam van de rubriek"><button class="sv gbtn" data-gsave="${g.id}">Opslaan</button><button class="cx gbtn" data-gcancel="${g.id}">Annuleren</button></div>`:`<h2>${esc(g.t)}</h2>`}
      <span class="gact"><span class="gc">${dn} van ${all.length}</span>${editingGroup===g.id?"":`<button class="noteicon plus" data-gadd="${g.id}" aria-label="Taak toevoegen aan ${esc(g.t)}" title="Taak toevoegen">${IC.plus}</button><button class="noteicon" data-gedit="${g.id}" aria-label="Naam van ${esc(g.t)} wijzigen" title="Naam wijzigen">${IC.edit}</button><button class="noteicon del" data-gdel="${g.id}" aria-label="Rubriek ${esc(g.t)} verwijderen" title="Rubriek verwijderen">${IC.del}</button>`}</span></div><ul class="tasks">`;
    vis.forEach(t=>{html+=taskLi(t,g.id,false)});
    html+=`</ul>${!vis.length?`<p class="emptyg">${all.length?(all.every(t=>t.done)?"Alles in deze rubriek is afgerond.":"Geen taken voor deze filters."):"Nog geen taken. Klik op het plusje of sleep een taak hierheen."}</p>`:""}
      ${adding===g.id?`<div class="addrow"><input type="text" data-add="${g.id}" placeholder="Nieuwe taak" aria-label="Nieuwe taak in ${esc(g.t)}"><input type="date" data-adddue="${g.id}" aria-label="Datum voor nieuwe taak"><button class="sv gbtn" data-addsave="${g.id}">Opslaan</button><button class="cx gbtn" data-addcancel="${g.id}">Annuleren</button></div>`:""}</section>`;
  });
  const doneList=groups.flatMap(g=>state.tasks.filter(t=>t.g===g.id&&!t.del&&t.done&&match(t))).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));
  if(doneList.length){shown+=1;html+=`<section class="grp donegrp"><div class="gh"><h2><button class="dtoggle" data-donetoggle aria-expanded="${doneOpen}">${IC.chev}Afgerond</button></h2><span class="gc">${doneList.length} ${doneList.length>1?"taken":"taak"}</span></div>${doneOpen?`<ul class="tasks">${doneList.map(t=>taskLi(t,t.g,true)).join("")}</ul>`:""}</section>`}
  list.innerHTML=shown?html:(GA().length?`<p class="empty">Geen taken voor deze filters. Zet een filter uit of wis de zoekterm.</p>`:`<p class="empty">Nog geen rubrieken. Maak er een aan, bijvoorbeeld met de naam van een klant.</p>`);
  const live=liveT(),tot=live.length,dn=live.filter(t=>t.done).length,p=tot?Math.round(dn/tot*100):0;
  const tdN=live.filter(t=>!t.done&&t.due&&dueInfo(t.due).diff===0).length,lateN=live.filter(t=>!t.done&&t.due&&dueInfo(t.due).diff<0).length;
  document.getElementById("today").innerHTML=(tdN?`Je hebt vandaag nog <strong>${tdN}</strong> ${tdN>1?"taken":"taak"} open`:"Voor vandaag staat er niets meer open")+(lateN?`${tdN?" en":", wel"} <strong class="late">${lateN}</strong> verlopen`:"")+".";
  document.getElementById("count").innerHTML=`${dn} <small>van ${tot} taken klaar</small>`;
  document.getElementById("bar").style.width=p+"%";document.getElementById("barwrap").setAttribute("aria-valuenow",p);
  const nd=state.tasks.filter(t=>t.del).length,rb=document.getElementById("restore");rb.hidden=!nd;rb.textContent=`Herstel verwijderde taken (${nd})`;
  const ng=state.groups.filter(g=>g.del).length,rg=document.getElementById("restoreg");rg.hidden=!ng;rg.textContent=`Herstel verwijderde rubrieken (${ng})`;
  const withNote=live.filter(t=>t.note);
  document.getElementById("togglenotes").textContent=withNote.length&&withNote.every(t=>openT.has(t.id))?"Alle taaknotities inklappen":"Alle taaknotities uitklappen";
}

/* task events */
const L=document.getElementById("list");
L.addEventListener("change",e=>{
  const el=e.target;
  if(el.classList.contains("cb")){const id=el.closest(".task").dataset.id,t=state.tasks.find(x=>x.id===id);t.done=el.checked;t.doneAt=el.checked?Date.now():0;save();render();const c=document.getElementById("cb-"+id);if(c)c.focus();if(el.checked)toast(`"${t.t}" afgerond`,()=>{t.done=false;t.doneAt=0;save();render()});return}
  if(el.dataset.mv){const t=state.tasks.find(x=>x.id===el.dataset.mv);if(el.value){moveTask(t,el.value)}return}
  if(el.dataset.due){const t=state.tasks.find(x=>x.id===el.dataset.due);t.due=el.value||"";save();render();const d=document.getElementById("dd-"+t.id);if(d)d.focus();return}
});
L.addEventListener("input",e=>{
  const id=e.target.dataset.ta;if(!id)return;const t=state.tasks.find(x=>x.id===id);t.note=e.target.value;save();
  const btn=document.querySelector(`.acts [data-open="${id}"]`);if(btn){btn.classList.toggle("has",!!t.note.trim());const dot=btn.querySelector(".dot");if(t.note.trim()&&!dot)btn.insertAdjacentHTML("beforeend",'<span class="dot"></span>');if(!t.note.trim()&&dot)dot.remove()}
});
L.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.dataset.add!==undefined){addTask(e.target.dataset.add);return}
  if(e.key==="Escape"&&e.target.dataset.add!==undefined){const g=adding;adding=null;render();focusQ(`[data-gadd="${g}"]`);return}
  if(e.target.dataset.et){if(e.key==="Enter")saveEdit(e.target.dataset.et);if(e.key==="Escape"){const id=editing;editing=null;render();focusQ(`[data-edit="${id}"]`)}return}
  if(e.target.dataset.gin){if(e.key==="Enter")saveGroup(e.target.dataset.gin);if(e.key==="Escape"){const id=editingGroup;editingGroup=null;render();focusQ(`[data-gedit="${id}"]`)}}
});
const focusQ=s=>{const el=document.querySelector(s);if(el)el.focus()};
function addTask(g){const inp=document.querySelector(`[data-add="${g}"]`),v=inp?inp.value.trim():"";if(!v){if(inp)inp.focus();toast("Typ eerst een taak");return}
  const dd=document.querySelector(`[data-adddue="${g}"]`);state.tasks.push({id:uid(),g,t:v,due:dd?dd.value:"",note:"",done:false});save();render();toast(`"${v}" opgeslagen in ${gname(g)}`);focusQ(`[data-add="${g}"]`)}
L.addEventListener("click",e=>{
  const c=s=>e.target.closest(s);let b;
  if(b=c(".duepick")){try{if(b.showPicker)b.showPicker()}catch(_){}return}
  if(b=c("[data-donetoggle]")){doneOpen=!doneOpen;render();focusQ("[data-donetoggle]");return}
  if(b=c("[data-addsave]")){addTask(b.dataset.addsave);return}
  if(b=c("[data-gadd]")){const id=b.dataset.gadd;adding=adding===id?null:id;render();if(adding)focusQ(`[data-add="${id}"]`);return}
  if(b=c("[data-addcancel]")){const id=b.dataset.addcancel;adding=null;render();focusQ(`[data-gadd="${id}"]`);return}
  if(b=c("[data-open]")){const id=b.dataset.open;openT.has(id)?openT.delete(id):openT.add(id);render();
    if(openT.has(id))focusQ(`[data-ta="${id}"]`);else focusQ(`.tbtn[data-open="${id}"]`);return}
  if(b=c("[data-nodue]")){const t=state.tasks.find(x=>x.id===b.dataset.nodue);t.due="";save();render();focusQ(`#dd-${t.id}`);return}
  if(b=c("[data-del]")){const t=state.tasks.find(x=>x.id===b.dataset.del);t.del=true;openT.delete(t.id);save();render();toast(`"${t.t}" verwijderd`,()=>{t.del=false;save();render()});return}
  if(b=c("[data-edit]")){editing=b.dataset.edit;render();const f=document.querySelector(`[data-et="${editing}"]`);if(f){f.focus();f.select()}return}
  if(b=c("[data-save]")){saveEdit(b.dataset.save);return}
  if(b=c("[data-cancel]")){const id=b.dataset.cancel;editing=null;render();focusQ(`[data-edit="${id}"]`);return}
  if(b=c("[data-gdel]")){const g=state.groups.find(x=>x.id===b.dataset.gdel),n=state.tasks.filter(t=>t.g===g.id&&!t.del).length;g.del=true;save();buildFilters();render();renderNotes();
    toast(`Rubriek "${g.t}" verwijderd${n?` met ${n} ta${n>1?"ken":"ak"}`:""}`,()=>{g.del=false;save();buildFilters();render();renderNotes()});return}
  if(b=c("[data-gedit]")){editingGroup=b.dataset.gedit;render();const f=document.querySelector(`[data-gin="${editingGroup}"]`);if(f){f.focus();f.select()}return}
  if(b=c("[data-gsave]")){saveGroup(b.dataset.gsave);return}
  if(b=c("[data-gcancel]")){const id=b.dataset.gcancel;const g=state.groups.find(x=>x.id===id);if(g&&g.fresh){g.del=true;g.purge=true;state.groups=state.groups.filter(x=>!x.purge)}editingGroup=null;render();buildFilters();return}
});
function saveEdit(id){const f=document.querySelector(`[data-et="${id}"]`),v=f.value.trim();if(!v){f.setAttribute("aria-invalid","true");f.focus();return}
  state.tasks.find(x=>x.id===id).t=v;editing=null;save();render();focusQ(`[data-edit="${id}"]`)}
function saveGroup(id){const f=document.querySelector(`[data-gin="${id}"]`),v=f.value.trim();if(!v){f.focus();return}
  const g=state.groups.find(x=>x.id===id);g.t=v;if(g.fresh)adding=id;delete g.fresh;editingGroup=null;save();buildFilters();render();renderNotes();focusQ(`[data-add="${id}"]`)}
function addGroup(){const g={id:uid(),t:"Nieuwe rubriek",fresh:true};state.groups.push(g);F.rub.clear();editingGroup=g.id;buildFilters();render();
  const f=document.querySelector(`[data-gin="${g.id}"]`);if(f){f.scrollIntoView({block:"center"});f.focus();f.select()}}
document.getElementById("addgroup").onclick=addGroup;
function moveTask(t,gid){t.g=gid;save();render();toast(`"${t.t}" verplaatst naar ${gname(gid)}`)}

/* drag and drop */
let dragId=null;
L.addEventListener("dragstart",e=>{const li=e.target.closest&&e.target.closest("li.task");if(!li)return;dragId=li.dataset.id;li.classList.add("dragging");document.body.classList.add("isdrag");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId)}catch(_){}});
L.addEventListener("dragend",()=>{dragId=null;document.body.classList.remove("isdrag");document.querySelectorAll(".dragging,.over").forEach(x=>x.classList.remove("dragging","over"))});
L.addEventListener("dragover",e=>{if(!dragId)return;const s=e.target.closest("section.grp[data-group]");if(!s)return;e.preventDefault();document.querySelectorAll("section.over").forEach(x=>x!==s&&x.classList.remove("over"));s.classList.add("over")});
L.addEventListener("drop",e=>{if(!dragId)return;const s=e.target.closest("section.grp[data-group]");if(!s)return;e.preventDefault();const t=state.tasks.find(x=>x.id===dragId),gid=s.dataset.group;
  const li=e.target.closest("li.task");
  if(li&&li.dataset.id!==dragId){const i=state.tasks.indexOf(t);state.tasks.splice(i,1);t.g=gid;const j=state.tasks.findIndex(x=>x.id===li.dataset.id);state.tasks.splice(j,0,t);save();render();return}
  if(t.g!==gid)moveTask(t,gid)});

/* footer actions */
document.getElementById("copy").onclick=()=>{
  let out=[];GA().forEach(g=>{const o=state.tasks.filter(t=>t.g===g.id&&!t.del&&!t.done);if(!o.length)return;out.push(g.t);o.forEach(t=>{const d=dueInfo(t.due);out.push(`- ${t.t}${d?` (${d.t.toLowerCase()})`:""}${t.note?`\n  ${t.note.replace(/\n/g,"\n  ")}`:""}`)});out.push("")});
  const txt=out.join("\n").trim()||"Geen openstaande taken";
  const fb=()=>{const ta=document.createElement("textarea");ta.value=txt;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();toast(ok?"Openstaande taken gekopieerd":"Kopiëren lukte niet in deze weergave")};
  if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast("Openstaande taken gekopieerd"),fb);else fb();
};
document.getElementById("togglenotes").onclick=()=>{const w=liveT().filter(t=>t.note);if(w.length&&w.every(t=>openT.has(t.id)))w.forEach(t=>openT.delete(t.id));else w.forEach(t=>openT.add(t.id));render()};
document.getElementById("reset").onclick=()=>{const was=state.tasks.filter(t=>t.done).map(t=>t.id);if(!was.length){toast("Er staan geen vinkjes");return}
  state.tasks.forEach(t=>t.done=false);save();render();toast(`${was.length} vinkje${was.length>1?"s":""} gewist`,()=>{state.tasks.forEach(t=>{if(was.includes(t.id))t.done=true});save();render()})};
document.getElementById("restore").onclick=()=>{const n=state.tasks.filter(t=>t.del).length;state.tasks.forEach(t=>t.del=false);save();render();toast(`${n} ta${n>1?"ken":"ak"} hersteld`)};
document.getElementById("restoreg").onclick=()=>{const n=state.groups.filter(g=>g.del).length;state.groups.forEach(g=>g.del=false);save();buildFilters();render();renderNotes();toast(`${n} rubriek${n>1?"en":""} hersteld`)};

/* notes */
const COLS={none:"Wit",pink:"Roze",tea:"Groen",aub:"Paars",sand:"Zand"};
const NL=document.getElementById("notes");
function nmatch(n){if(n.del)return false;if(F.rub.size&&!F.rub.has(n.g))return false;if(F.q&&!(n.t+" "+n.body).toLowerCase().includes(F.q))return false;return true}
function fmtUpd(ts){if(!ts)return"";const d=new Date(ts);const t=today();const dd=new Date(d);dd.setHours(0,0,0,0);
  if(+dd===+t)return d.toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});return `${d.getDate()} ${MON[d.getMonth()]}`}
function renderNotes(){
  const vis=state.notes.filter(nmatch).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||(b.upd||0)-(a.upd||0));
  NL.innerHTML=vis.length?vis.map(n=>{const o=openN.has(n.id),g=GA().find(x=>x.id===n.g);
    return `<article class="note${o?" open":""}" data-c="${n.c||"none"}" data-nid="${n.id}">
      <button class="nbtn" data-nopen="${n.id}" aria-expanded="${o}"><span class="nt${n.t?"":" untitled"}">${n.t?esc(n.t):"Zonder titel"}</span><span class="nm">${g?`<span class="chip">${esc(g.t)}</span>`:""}<span>${fmtUpd(n.upd)}</span></span></button>
      ${o?`<div class="nbody"><input class="ntitle" data-nt="${n.id}" value="${esc(n.t)}" placeholder="Titel" aria-label="Titel van de notitie">
      <textarea data-nb="${n.id}" placeholder="Schrijf je notitie" aria-label="Notitie">${esc(n.body)}</textarea>
      <div class="nfoot"><label>Rubriek <select data-ng="${n.id}"><option value="">Geen</option>${GA().map(x=>`<option value="${x.id}"${x.id===n.g?" selected":""}>${esc(x.t)}</option>`).join("")}</select></label>
      <span class="sw" role="group" aria-label="Kleur">${Object.keys(COLS).map(k=>`<button data-col="${k}" data-ncol="${n.id}" aria-pressed="${(n.c||"none")===k}" aria-label="${COLS[k]}" title="${COLS[k]}"></button>`).join("")}</span>
      <span class="acts"><button class="noteicon del" data-ndel="${n.id}" aria-label="Notitie verwijderen" title="Verwijderen">${IC.del}</button></span></div></div>`:""}</article>`}).join("")
    :`<p class="nempty">${state.notes.some(n=>!n.del)?"Geen notities voor deze filters.":"Nog geen notities. Klik op Nieuwe notitie om er een te maken."}</p>`;
  const nd=state.notes.filter(n=>n.del).length,r=document.getElementById("restoren");r.hidden=!nd;r.textContent=`Herstel verwijderde notities (${nd})`;
}
document.getElementById("newnote").onclick=()=>{const n={id:uid(),t:"",body:"",g:F.rub.size===1?[...F.rub][0]:"",c:"none",upd:Date.now()};state.notes.unshift(n);openN.add(n.id);save();renderNotes();focusQ(`[data-nt="${n.id}"]`)};
NL.addEventListener("click",e=>{const c=s=>e.target.closest(s);let b;
  if(b=c("[data-nopen]")){const id=b.dataset.nopen;openN.has(id)?openN.delete(id):openN.add(id);
    const n=state.notes.find(x=>x.id===id);if(!openN.has(id)&&!n.t.trim()&&!n.body.trim()){state.notes=state.notes.filter(x=>x!==n);save()}
    renderNotes();if(openN.has(id))focusQ(`[data-nb="${id}"]`);else focusQ(`[data-nopen="${id}"]`);return}
  if(b=c("[data-ncol]")){const n=state.notes.find(x=>x.id===b.dataset.ncol);n.c=b.dataset.col;save();renderNotes();focusQ(`[data-ncol="${n.id}"][data-col="${n.c}"]`);return}
  if(b=c("[data-ndel]")){const n=state.notes.find(x=>x.id===b.dataset.ndel);n.del=true;openN.delete(n.id);save();renderNotes();toast(`Notitie${n.t?` "${n.t}"`:""} verwijderd`,()=>{n.del=false;save();renderNotes()});return}
});
NL.addEventListener("input",e=>{const d=e.target.dataset;
  if(d.nt){const n=state.notes.find(x=>x.id===d.nt);n.t=e.target.value;n.upd=Date.now();save();const s=document.querySelector(`[data-nopen="${n.id}"] .nt`);s.textContent=n.t||"Zonder titel";s.classList.toggle("untitled",!n.t)}
  if(d.nb){const n=state.notes.find(x=>x.id===d.nb);n.body=e.target.value;n.upd=Date.now();save()}
});
NL.addEventListener("change",e=>{if(e.target.dataset.ng){const n=state.notes.find(x=>x.id===e.target.dataset.ng);n.g=e.target.value;save();renderNotes();focusQ(`[data-ng="${n.id}"]`)}});
NL.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset.nt){e.preventDefault();focusQ(`[data-nb="${e.target.dataset.nt}"]`)}});
document.getElementById("restoren").onclick=()=>{const n=state.notes.filter(x=>x.del).length;state.notes.forEach(x=>x.del=false);save();renderNotes();toast(`${n} notitie${n>1?"s":""} hersteld`)};

/* toast */
let tt;function toast(msg,undo){const el=document.getElementById("toast");clearTimeout(tt);el.innerHTML=esc(msg);
  if(undo){const u=document.createElement("button");u.className="undo";u.textContent="Ongedaan maken";u.onclick=()=>{undo();el.textContent=""};el.appendChild(u)}
  tt=setTimeout(()=>el.textContent="",undo?6000:3000)}

/* back-up */
document.getElementById("export").onclick=()=>{
  const d=new Date(),stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`taken-backup-${stamp}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Back-up gedownload");
};
document.getElementById("import").onclick=()=>document.getElementById("importfile").click();
document.getElementById("importfile").addEventListener("change",e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  const r=new FileReader();r.onload=()=>{
    try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.groups)||!Array.isArray(d.tasks))throw 0;
      if(!Array.isArray(d.notes))d.notes=[];
      if(!confirm("Deze back-up vervangt alle taken en notities op dit apparaat. Doorgaan?"))return;
      const prev=JSON.parse(JSON.stringify(state));state=d;F.rub.clear();save();buildFilters();render();renderNotes();
      toast("Back-up teruggezet",()=>{state=prev;save();buildFilters();render();renderNotes()});
    }catch(_){toast("Dit is geen geldig back-upbestand")}
  };r.readAsText(f);
});

/* bij terugkeer naar de app: datums en 'vandaag' bijwerken */
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!document.activeElement.matches("input,textarea,select"))render()});

/* PWA: offline werken */
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}

/* ---------- synchronisatie via Supabase ---------- */
const SB_URL="https://htgdodlndmzilfhxetbl.supabase.co";
const SB_KEY="sb_publishable_rxYj1MEXn2Has6uQV1N9_Q_WEiHKgOW";
const MKEY=KEY+":sync",SKIPKEY=KEY+":nologin";
let sb=null,user=null,pushTimer=null,deferTimer=null,pushing=false,chan=null,lastOk="";
let meta={uid:null,base:0};try{Object.assign(meta,JSON.parse(localStorage.getItem(MKEY)||"{}"))}catch(e){}
const saveMeta=()=>{try{localStorage.setItem(MKEY,JSON.stringify(meta))}catch(e){}};
const dirty=()=>(state.ts||0)>(meta.base||0);
const hhmm=()=>new Date().toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"});
const hasContent=x=>x&&((x.tasks||[]).some(t=>!t.del)||(x.notes||[]).some(n=>!n.del)||(x.groups||[]).filter(g=>!g.del).length>1);
const sameContent=(a,b)=>{const c=o=>JSON.stringify(Object.assign({},o,{ts:0}));return c(a)===c(b)};

function syncText(){
  if(!sb)return navigator.onLine?"Opgeslagen op dit apparaat":"Offline · opgeslagen op dit apparaat";
  if(!user)return "Alleen op dit apparaat · Inloggen";
  if(!navigator.onLine)return "Offline · wordt later gesynchroniseerd";
  if(dirty()||pushing)return "Synchroniseren…";
  return lastOk?`Gesynchroniseerd · ${lastOk}`:"Gesynchroniseerd";
}
function syncLabel(){setSync(syncText());const a=document.getElementById("astat");if(a)a.textContent=syncText()}

function applyState(d){
  if(!Array.isArray(d.notes))d.notes=[];
  state=d;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  F.rub.clear();buildFilters();render();renderNotes();
}
function busy(){
  const a=document.activeElement;
  return !!(a&&a.matches&&a.matches("input:not(#q),textarea,select")&&!a.closest("#acct"));
}
function downloadBackup(tag){
  const d=new Date(),stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`taken-backup-${tag?tag+"-":""}${stamp}.json`;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function schedulePush(ms=800){if(!user)return;clearTimeout(pushTimer);pushTimer=setTimeout(push,ms);syncLabel()}
async function push(){
  if(!user||pushing)return;
  if(!navigator.onLine){syncLabel();return}
  pushing=true;const snap=state.ts||0;
  let error=null;
  try{({error}=await sb.from("boards").upsert({user_id:user.id,data:state,updated_at:new Date().toISOString()}))}catch(e){error=e}
  pushing=false;
  if(error){setSync("Synchroniseren mislukt · probeert het zo opnieuw");clearTimeout(pushTimer);pushTimer=setTimeout(push,15000);return}
  meta.base=Math.max(meta.base||0,snap);saveMeta();lastOk=hhmm();
  if(dirty())schedulePush(300);else syncLabel();
}
async function fetchRow(){
  try{const {data,error}=await sb.from("boards").select("data,updated_at").eq("user_id",user.id).maybeSingle();
    if(error)throw error;return data}catch(e){syncLabel();return undefined}
}
function handleRemote(row){
  if(!row||!row.data)return;
  const r=row.data,rts=r.ts||0;
  if(rts===state.ts){if(meta.base!==rts){meta.base=rts;saveMeta()}lastOk=hhmm();syncLabel();return}
  if(rts<=(meta.base||0)){if(dirty())schedulePush(0);return}
  if(busy()){clearTimeout(deferTimer);deferTimer=setTimeout(()=>handleRemote(row),1500);return}
  if(dirty()&&state.ts>rts){schedulePush(0);return}
  const hadLocal=dirty();
  applyState(r);meta.base=rts;saveMeta();lastOk=hhmm();syncLabel();
  if(hadLocal)toast("Een nieuwere versie van een ander apparaat is overgenomen");
}
async function pull(){
  if(!user)return;
  const row=await fetchRow();
  if(row===undefined)return;
  if(row===null){if(!state.ts)state.ts=Date.now();schedulePush(0);return}
  handleRemote(row);
}
async function firstSync(){
  const row=await fetchRow();
  if(row===undefined){toast("Geen verbinding, synchronisatie volgt later");return false}
  if(row===null){
    meta={uid:user.id,base:0};saveMeta();
    if(!state.ts)state.ts=Date.now();
    schedulePush(0);toast("Je takenlijst staat nu online");return true;
  }
  if(hasContent(state)&&!sameContent(state,row.data)){downloadBackup("dit-apparaat");}
  applyState(row.data);meta={uid:user.id,base:row.data.ts||0};saveMeta();lastOk=hhmm();
  toast("Je taken zijn opgehaald");return true;
}
function subscribe(){
  if(chan)sb.removeChannel(chan);
  chan=sb.channel("board-"+user.id)
    .on("postgres_changes",{event:"*",schema:"public",table:"boards",filter:"user_id=eq."+user.id},p=>{if(p.new&&p.new.data)handleRemote(p.new)})
    .subscribe();
}
async function onLogin(u){
  user=u;closeAcct();syncLabel();
  const ok=meta.uid===u.id?(await pull(),true):await firstSync();
  if(ok!==false){subscribe()}
  syncLabel();
}

/* account-venster */
const AC=document.getElementById("acct");
function openAcct(){
  if(!sb){toast("Synchroniseren is nu niet beschikbaar (geen verbinding)");return}
  document.getElementById("acct-in").hidden=!!user;
  document.getElementById("acct-out").hidden=!user;
  if(user){document.getElementById("aemail").textContent=user.email||"";syncLabel()}
  document.getElementById("lerr").textContent="";
  AC.hidden=false;
  setTimeout(()=>(user?document.getElementById("aclose"):document.getElementById("lemail")).focus(),30);
}
function closeAcct(){AC.hidden=true}
document.getElementById("sync").onclick=openAcct;
document.getElementById("lskip").onclick=()=>{try{localStorage.setItem(SKIPKEY,"1")}catch(e){}closeAcct()};
document.getElementById("aclose").onclick=closeAcct;
AC.addEventListener("keydown",e=>{if(e.key==="Escape")closeAcct()});
AC.addEventListener("click",e=>{if(e.target===AC)closeAcct()});
document.getElementById("anow").onclick=async()=>{setSync("Synchroniseren…");await pull();if(dirty())await push();syncLabel()};
document.getElementById("alogout").onclick=async()=>{
  if(!confirm("Uitloggen? Je taken blijven op dit apparaat staan, maar worden niet meer gesynchroniseerd."))return;
  await sb.auth.signOut();user=null;if(chan){sb.removeChannel(chan);chan=null}closeAcct();syncLabel();
};
document.getElementById("lform").addEventListener("submit",async e=>{
  e.preventDefault();
  const em=document.getElementById("lemail").value.trim(),pw=document.getElementById("lpass").value,err=document.getElementById("lerr"),btn=document.getElementById("lbtn");
  if(!em||!pw){err.textContent="Vul je e-mailadres en wachtwoord in.";return}
  btn.disabled=true;btn.textContent="Bezig…";err.textContent="";
  try{
    const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
    if(error)throw error;
    try{localStorage.removeItem(SKIPKEY)}catch(_){}
    document.getElementById("lpass").value="";
    await onLogin(data.user);
  }catch(x){
    err.textContent=/invalid/i.test(x.message||"")?"E-mailadres of wachtwoord klopt niet.":(navigator.onLine?"Inloggen lukte niet: "+(x.message||"onbekende fout"):"Je bent offline. Probeer het opnieuw met internet.");
  }finally{btn.disabled=false;btn.textContent="Inloggen"}
});

window.addEventListener("online",()=>{syncLabel();pull()});
window.addEventListener("offline",syncLabel);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")pull()});
setInterval(()=>{if(document.visibilityState==="visible")pull()},60000);

async function initSync(){
  if(!window.supabase||!window.supabase.createClient){syncLabel();return}
  try{sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"taken-auth"}})}catch(e){sb=null;syncLabel();return}
  sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==="SIGNED_OUT"){user=null;syncLabel()}
    else if(session&&session.user&&user){user=session.user}
  });
  const {data}=await sb.auth.getSession();
  if(data&&data.session&&data.session.user){onLogin(data.session.user)}
  else{syncLabel();let skip=false;try{skip=localStorage.getItem(SKIPKEY)==="1"}catch(e){}if(!skip)openAcct()}
}

buildFilters();render();renderNotes();
initSync();
</script>
